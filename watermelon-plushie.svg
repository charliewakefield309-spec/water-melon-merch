<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">Watermelon-headed block character plush</title>
  <desc id="desc">A blocky character plush inspired by the reference: red watermelon head, leafy green rind and slice hat, oversized black jacket, and striped green pants.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#dce8e7"/>
      <stop offset="1" stop-color="#f8f6ef"/>
    </linearGradient>
    <linearGradient id="melon" x2="0" y2="1">
      <stop stop-color="#ff5960"/>
      <stop offset="1" stop-color="#df3445"/>
    </linearGradient>
    <linearGradient id="pants" x2="1" y2="0">
      <stop stop-color="#68c83e"/>
      <stop offset=".48" stop-color="#3d9b36"/>
      <stop offset="1" stop-color="#79d14a"/>
    </linearGradient>
    <pattern id="stripes" width="17" height="22" patternUnits="userSpaceOnUse">
      <path d="M4 0v22M12 0v22" stroke="#a3e266" stroke-width="3" opacity=".8"/>
      <path d="M8 0v22" stroke="#247b36" stroke-width="2" opacity=".7"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#333b35" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="640" height="760" rx="28" fill="url(#background)"/>
  <ellipse cx="321" cy="686" rx="179" ry="25" fill="#77817a" opacity=".22"/>
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Slice cap: triangular red fruit with a dark-green outer rind -->
    <path d="M215 179 289 59q8-13 17 0l124 120q-104 52-215 0Z" fill="#258d39" stroke="#18702e" stroke-width="8"/>
    <path d="m229 164 62-97q8-12 16-2l105 98q-88 40-183 1Z" fill="#fa5660" stroke="#db3848" stroke-width="5"/>
    <path d="M220 174q105 45 212-1l-9 23q-99 43-195 1Z" fill="#48ad39" stroke="#267e32" stroke-width="5"/>
    <path d="M230 179q95 40 191-1" fill="none" stroke="#b2df61" stroke-width="8"/>
    <g fill="#282d29">
      <ellipse cx="275" cy="122" rx="5" ry="10" transform="rotate(-27 275 122)"/>
      <ellipse cx="312" cy="97" rx="5" ry="10" transform="rotate(-12 312 97)"/>
      <ellipse cx="348" cy="122" rx="5" ry="10" transform="rotate(18 348 122)"/>
      <ellipse cx="377" cy="150" rx="5" ry="9" transform="rotate(31 377 150)"/>
    </g>
    <!-- Square fruit head and leafy hair/rind -->
    <path d="M237 180h168v148H237z" fill="url(#melon)" stroke="#b92c3c" stroke-width="7"/>
    <path d="M236 184q-16-13-24 2l18 11-21 5 24 11-15 12 23 3q8-20 1-44Z" fill="#269039" stroke="#18702e" stroke-width="4"/>
    <path d="M405 184q17-13 24 2l-18 11 21 5-24 11 15 12-23 3q-8-20-1-44Z" fill="#269039" stroke="#18702e" stroke-width="4"/>
    <path d="M238 195q16-22 31-4 12-27 30-7 12-26 28-7 14-24 29-3 15-19 31 2 14-14 28 5l-8 22H239Z" fill="#339d39" stroke="#18702e" stroke-width="5"/>
    <!-- Simple stitched face -->
    <path d="M274 257h16m68 0h16" stroke="#252d29" stroke-width="7"/>
    <path d="M300 285h42" stroke="#252d29" stroke-width="6"/>
    <!-- Black boxy jacket, white lapels, and green shirt/tie -->
    <path d="M202 337q14-19 39-22h120q26 3 40 22l37 179H165Z" fill="#17191c" stroke="#090a0b" stroke-width="9"/>
    <path d="m241 316 64 41-29 86-47-83Z" fill="#f3f0e5" stroke="#d7d4ca" stroke-width="5"/>
    <path d="m360 316-55 41 29 86 47-83Z" fill="#f3f0e5" stroke="#d7d4ca" stroke-width="5"/>
    <path d="m286 354 19 13 19-13-9 91h-20Z" fill="#63c83c" stroke="#2b8a36" stroke-width="4"/>
    <path d="M233 429h24m132 0h24" stroke="#35383a" stroke-width="6"/>
    <!-- Wide rectangular sleeves -->
    <path d="M202 338h-37l-33 150q-3 18 14 22l32 4 41-161Z" fill="#191b1d" stroke="#090a0b" stroke-width="8"/>
    <path d="M402 338h37l33 150q3 18-14 22l-32 4-41-161Z" fill="#191b1d" stroke="#090a0b" stroke-width="8"/>
    <path d="m140 494 41 7-5 18-43-6Zm360 0-41 7 5 18 43-6Z" fill="#68c53e" stroke="#318934" stroke-width="5"/>
    <!-- Two separated, straight striped legs -->
    <path d="M197 518h100v143q-48 12-100 0Z" fill="url(#pants)" stroke="#357f32" stroke-width="7"/>
    <path d="M307 518h100v143q-48 12-100 0Z" fill="url(#pants)" stroke="#357f32" stroke-width="7"/>
    <path d="M197 518h100v143q-48 12-100 0Z" fill="url(#stripes)" opacity=".8"/>
    <path d="M307 518h100v143q-48 12-100 0Z" fill="url(#stripes)" opacity=".8"/>
    <path d="M198 658q49 12 98 0v15q-49 14-98 0Zm110 0q49 12 98 0v15q-49 14-98 0Z" fill="#287d34"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="320" y="720" fill="#263f33" font-size="21" font-weight="700" letter-spacing="2">WATERMELON AVATAR PLUSH</text>
    <text x="320" y="745" fill="#69736d" font-size="13" letter-spacing="1">BLOCKY SILHOUETTE • SLICE CAP • BLACK JACKET • GREEN STRIPED PANTS</text>
  </g>
</svg>
